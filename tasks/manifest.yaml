schema_version: 1
project: shelfops
owner: Mateo Vázquez
phase: PLANNING_BASELINE
manifest_owner: lead-orchestrator
updated_at: "2026-07-17"

policies:
  max_total_threads: 4
  max_subagent_depth: 1
  max_correction_attempts: 2
  exclusive_manifest_writer: lead-orchestrator
  implementation_authorized: false
  push_authorized: false
  pull_request_authorized: false
  deploy_authorized: false

active_wave: WAVE-PLANNING-BASELINE

waves:
  - id: WAVE-PLANNING-BASELINE
    kind: planning
    status: READY
    plan: plans/PLAN-0000-planning-baseline.md
    exit_gate: G3
  - id: WAVE-01
    kind: implementation
    status: DRAFT
    plan: null
    exit_gate: G5
    note: Must be generated by the baseline and explicitly authorized by owner.

tasks:
  - id: SO-PLAN-001
    wave: WAVE-PLANNING-BASELINE
    title: Create planning baseline structure and validation strategy
    role: lead-orchestrator
    status: READY
    blockers: []
    write_scope:
      - docs/**
      - specs/**
      - contracts/**
      - evals/**
      - evidence/**
      - open-items/**
    forbidden:
      - application-code
      - dependency-installation
    acceptance:
      - Required planning directories exist.
      - Validation commands or dependency-free checks are documented.

  - id: SO-PLAN-002
    wave: WAVE-PLANNING-BASELINE
    title: Define product glossary, domain model, ledger and invariants
    role: planner
    status: DRAFT
    blockers: [SO-PLAN-001]
    write_scope:
      - docs/product/**
      - docs/domain/**
    acceptance:
      - Terms are unambiguous and linked to requirement IDs.
      - Ledger invariants include nominal, duplicate, ordering and replay oracles.

  - id: SO-PLAN-003
    wave: WAVE-PLANNING-BASELINE
    title: Define architecture boundaries and foundational ADRs
    role: planner
    status: DRAFT
    blockers: [SO-PLAN-001]
    write_scope:
      - docs/architecture/**
    acceptance:
      - C4 context and container views define ownership and trust boundaries.
      - Foundational ADRs record alternatives and consequences.

  - id: SO-PLAN-004
    wave: WAVE-PLANNING-BASELINE
    title: Define threat model, SLOs and load profiles
    role: planner
    status: DRAFT
    blockers: [SO-PLAN-001]
    write_scope:
      - docs/security/**
      - docs/operations/**
    acceptance:
      - Threats map to controls and verification.
      - SLOs and load profiles are measurable and parameterized.

  - id: SO-PLAN-005
    wave: WAVE-PLANNING-BASELINE
    title: Produce first capability specs and coherent API/event contracts
    role: planner
    status: DRAFT
    blockers: [SO-PLAN-002, SO-PLAN-003, SO-PLAN-004]
    write_scope:
      - specs/**
      - contracts/**
    serialized_resources:
      - openapi
      - asyncapi
      - schemas
    acceptance:
      - Specs cover nominal, negative, duplicate, restart, gap and rebuild cases.
      - OpenAPI, AsyncAPI and event envelope agree on IDs and semantics.

  - id: SO-PLAN-006
    wave: WAVE-PLANNING-BASELINE
    title: Create implementation DAG, flagship eval and draft WAVE-01
    role: lead-orchestrator
    status: DRAFT
    blockers: [SO-PLAN-005]
    write_scope:
      - plans/**
      - evals/**
      - tasks/manifest.yaml
    acceptance:
      - Every proposed work order has inputs, scope, blockers and commands.
      - WAVE-01 remains DRAFT and implementation_authorized remains false.

  - id: SO-PLAN-007
    wave: WAVE-PLANNING-BASELINE
    title: Perform independent clean-room review and close G0-G3
    role: reviewer
    status: DRAFT
    blockers: [SO-PLAN-006]
    write_scope:
      - evidence/**
      - open-items/**
    acceptance:
      - A fresh-context reviewer can reconstruct the first slice from repository files.
      - Every G0-G3 result has linked evidence or is marked INCONCLUSIVE.

open_items:
  - OPEN-REPOSITORY-PUBLICATION
  - OPEN-WAYFINDER-SKILL
