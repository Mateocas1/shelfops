name: Infra plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-plan.yml"

permissions:
  contents: read

concurrency:
  group: infra-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_CONTAINER_IMAGE: ${{ vars.TF_CONTAINER_IMAGE }}
      TF_MIGRATE_IMAGE: ${{ vars.TF_MIGRATE_IMAGE }}
      TF_ALARM_EMAIL: ${{ vars.TF_ALARM_EMAIL }}
      TF_MANAGE_OIDC_PROVIDER: ${{ vars.TF_MANAGE_OIDC_PROVIDER }}
      TF_OIDC_PROVIDER_ARN: ${{ vars.TF_OIDC_PROVIDER_ARN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.4

      - name: Check whether the plan role is configured
        id: guard
        run: |
          if [ -z "${AWS_PLAN_ROLE_ARN}" ]; then
            echo "plan=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping terraform plan: the AWS_PLAN_ROLE_ARN variable is not set."
          else
            echo "plan=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.guard.outputs.plan == 'true'
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: shelfops-plan-${{ github.run_id }}

      - name: Terraform init
        if: steps.guard.outputs.plan == 'true'
        working-directory: infra/terraform/envs/demo
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan
        id: plan
        if: steps.guard.outputs.plan == 'true'
        working-directory: infra/terraform/envs/demo
        continue-on-error: true
        run: |
          set -euo pipefail
          args=(
            -var "container_image=${TF_CONTAINER_IMAGE}"
            -var "migrate_image=${TF_MIGRATE_IMAGE}"
            -var "state_bucket_name=${TF_STATE_BUCKET}"
            -var "alarm_email=${TF_ALARM_EMAIL}"
          )
          if [ -n "${TF_MANAGE_OIDC_PROVIDER}" ]; then
            args+=(-var "manage_oidc_provider=${TF_MANAGE_OIDC_PROVIDER}")
          fi
          if [ -n "${TF_OIDC_PROVIDER_ARN}" ]; then
            args+=(-var "oidc_provider_arn=${TF_OIDC_PROVIDER_ARN}")
          fi
          terraform plan "${args[@]}" -no-color -input=false -out=tfplan

      - name: Render the plan
        if: always() && steps.guard.outputs.plan == 'true'
        working-directory: infra/terraform/envs/demo
        run: |
          set -euo pipefail
          if [ -f tfplan ]; then
            terraform show -no-color tfplan > /tmp/plan.txt
          else
            echo "Terraform plan did not produce a plan file." > /tmp/plan.txt
          fi
          head -c 60000 /tmp/plan.txt > /tmp/plan-comment.txt

      - name: Post or update the plan comment
        if: always() && steps.guard.outputs.plan == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- shelfops-terraform-plan -->";
            const plan = fs.existsSync("/tmp/plan-comment.txt") ? fs.readFileSync("/tmp/plan-comment.txt", "utf8") : "No plan output.";
            const body = [
              marker,
              "### Terraform plan (demo)",
              "",
              `Result: \`${process.env.PLAN_OUTCOME}\``,
              "",
              "<details><summary>Show plan</summary>",
              "",
              "```terraform",
              plan,
              "```",
              "",
              "</details>",
              ""
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail when the plan failed
        if: steps.guard.outputs.plan == 'true' && steps.plan.outcome != 'success'
        run: |
          echo "::error::Terraform plan failed."
          exit 1
