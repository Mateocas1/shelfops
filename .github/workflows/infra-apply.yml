name: Infra apply

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run
        type: choice
        options:
          - apply
          - destroy
        required: true
      confirm:
        description: Type demo-apply to confirm
        required: true

permissions:
  contents: read

concurrency:
  group: infra-apply-demo
  cancel-in-progress: false

jobs:
  apply:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Protected environment: configure required reviewers on "demo-apply" so a
    # human must approve before this job can assume the apply role.
    environment: demo-apply

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_APPLY_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_CONTAINER_IMAGE: ${{ vars.TF_CONTAINER_IMAGE }}
      TF_MIGRATE_IMAGE: ${{ vars.TF_MIGRATE_IMAGE }}
      TF_ALARM_EMAIL: ${{ vars.TF_ALARM_EMAIL }}
      TF_MANAGE_OIDC_PROVIDER: ${{ vars.TF_MANAGE_OIDC_PROVIDER }}
      TF_OIDC_PROVIDER_ARN: ${{ vars.TF_OIDC_PROVIDER_ARN }}
      ACTION: ${{ inputs.action }}
      CONFIRM: ${{ inputs.confirm }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.4

      - name: Validate the manual inputs
        run: |
          set -euo pipefail
          if [ -z "${AWS_APPLY_ROLE_ARN}" ]; then
            echo "::error::The AWS_APPLY_ROLE_ARN variable is not set."
            exit 1
          fi
          if [ "${CONFIRM}" != "demo-apply" ]; then
            echo "::error::Confirmation failed: type demo-apply to run this workflow."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: shelfops-apply-${{ github.run_id }}

      - name: Terraform init
        working-directory: infra/terraform/envs/demo
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform apply or destroy
        working-directory: infra/terraform/envs/demo
        run: |
          set -euo pipefail
          args=(
            -var "container_image=${TF_CONTAINER_IMAGE}"
            -var "migrate_image=${TF_MIGRATE_IMAGE}"
            -var "state_bucket_name=${TF_STATE_BUCKET}"
            -var "alarm_email=${TF_ALARM_EMAIL}"
          )
          if [ -n "${TF_MANAGE_OIDC_PROVIDER}" ]; then
            args+=(-var "manage_oidc_provider=${TF_MANAGE_OIDC_PROVIDER}")
          fi
          if [ -n "${TF_OIDC_PROVIDER_ARN}" ]; then
            args+=(-var "oidc_provider_arn=${TF_OIDC_PROVIDER_ARN}")
          fi
          case "${ACTION}" in
            apply)
              terraform apply "${args[@]}" -auto-approve -input=false
              ;;
            destroy)
              terraform destroy "${args[@]}" -auto-approve -input=false
              ;;
            *)
              echo "::error::Unknown action: ${ACTION}"
              exit 1
              ;;
          esac
